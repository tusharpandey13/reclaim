<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runner-up: The Month Sheet</title>
<style>
@font-face{font-family:A;src:url(fonts/AnekLatin.woff2);font-weight:400 800;font-stretch:75% 100%}
:root{--bg:#FFFFFF;--fg:#000;--m:#555;--c0:#F0F0F0;--c1:#FFD9C7;--c2:#FFAA85;--c3:#F26A35;--c4:#A83208;--bill:#000}
[data-theme=dark]{--bg:#121212;--fg:#fff;--m:#BBB;--c0:#232323;--c1:#4A2616;--c2:#8A4220;--c3:#D9622F;--c4:#FFB48F;--bill:#fff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:500 16px/1.25 A,sans-serif;font-stretch:88%;font-variant-numeric:tabular-nums;padding:12px 12px 72px;overflow-x:hidden}
.h{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}
.m{font-size:52px;font-weight:800;line-height:.95;letter-spacing:-.02em;font-stretch:75%}
.r{text-align:right;font-size:15px;color:var(--m)} .r b{display:block;font-size:26px;color:var(--fg);font-weight:700}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.w{font-size:13px;color:var(--m);padding:2px 0 4px}
.c{min-height:56px;background:var(--c0);padding:3px 4px;font-size:15px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.c small{font-size:12.5px;font-weight:700;line-height:1;color:inherit}
.c.l1{background:var(--c1)}.c.l2{background:var(--c2)}.c.l3{background:var(--c3)}.c.l4{background:var(--c4);color:#fff}
[data-theme=dark] .c.l4,[data-theme=dark] .c.l3{color:#000}
.c.t{outline:3px solid var(--fg);outline-offset:-3px;font-weight:800}
.c.f{background:none;box-shadow:inset 0 0 0 1px var(--m)}
.c.b small{background:var(--bill);color:var(--bg);padding:2px 3px;align-self:flex-start}
.s{display:grid;grid-template-columns:1fr auto;row-gap:6px;margin-top:12px;font-size:17px}
.s b{font-weight:700}
.e{font-size:30px;font-weight:800;font-stretch:80%;grid-column:1/-1;margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);box-shadow:0 -2px 0 var(--fg);display:grid;grid-template-columns:repeat(3,1fr)}
.bar a{display:flex;justify-content:center;align-items:center;min-height:56px;color:inherit;text-decoration:none;font-weight:700}
*{-webkit-tap-highlight-color:transparent}a:active,button:active{background-image:linear-gradient(rgba(127,127,127,.2),rgba(127,127,127,.2))}a.tap{min-height:48px}.bar a{min-height:60px}
</style></head><body>
<div class="h"><div class="m">Nov</div><div class="r">Likely left, 30th<b>₹30k ±5k</b></div></div>
<div class="g" id="g"></div>
<div class="s"><span>Have in bank</span><b>₹1,11,111</b><span>Owe on cards</span><b>₹44,444</b><span>Own in assets</span><b>₹33,33,333</b></div>
<nav class="bar"><a href="#">Month</a><a href="#">Year</a><a href="#">Lists</a></nav>
<script>
document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const g=document.getElementById('g');const L=[0,1,2,0,4,1,0,1,3,1,0,2,3,1,4,2];const B={1:'+2.2L',3:'−66k',5:'−44k',18:'−22k',20:'−11k',25:'−22k',27:'−1k',30:'−1k'};
'SMTWTFS'.split('').forEach(d=>g.insertAdjacentHTML('beforeend',`<div class="w">${d}</div>`));
for(let d=1;d<=30;d++){const f=d>16;const c=['c',f?'f':'l'+L[d-1],d===16?'t':'',B[d]?'b':''].join(' ');g.insertAdjacentHTML('beforeend',`<div class="${c}"><span>${d}</span>${B[d]?`<small>${B[d]}</small>`:''}</div>`)}
</script></body></html>
