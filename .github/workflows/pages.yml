# Publishes the invented-data demo to GitHub Pages. The app build itself holds no data; the demo files from
# client/html/fake/ are copied in beside it, as the owner's box would serve its own.
name: Demo on Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/html/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Add the invented demo data
        run: cp fake/*.json dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/html/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
